<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herencia LP · Rentas</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--r:#ed1c24;--bg:#0a0a0b;--c:#151517;--b:#2a2a2e;--t:#f4f4f5;--m:#8b8b93;--ok:#22c55e;--wa:#f59e0b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,#ed1c2433,transparent),var(--bg);color:var(--t);font:15px Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.k{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.04em;font-weight:400}
#splash{position:fixed;inset:0;background:#000;z-index:99;display:grid;place-items:center;text-align:center;transition:opacity .7s,visibility .7s;cursor:pointer}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:min(52vw,260px);filter:drop-shadow(0 0 40px #ed1c2477);animation:pop 1.2s ease both}
#splash h1{font-size:clamp(34px,8vw,64px);margin-top:14px;animation:pop 1.2s .3s ease both}
#splash p{color:var(--m);letter-spacing:.3em;font-size:12px;animation:pop 1.2s .6s ease both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}}
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(16px);background:#0a0a0bcc;border-bottom:1px solid var(--b)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:26px}
.brand img{height:42px}
nav{display:flex;gap:6px;overflow:auto;margin-left:auto}
nav button{background:none;border:1px solid transparent;color:var(--m);padding:8px 14px;border-radius:99px;cursor:pointer;font:500 14px Inter;white-space:nowrap}
nav button.on{background:var(--r);color:#fff}
nav button:not(.on):hover{border-color:var(--b);color:var(--t)}
main{max-width:1100px;margin:auto;padding:20px 16px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.card{background:linear-gradient(160deg,#1b1b1e,var(--c));border:1px solid var(--b);border-radius:18px;padding:18px}
.k{font-size:15px;color:var(--m)}
.big{font-family:'Bebas Neue';font-size:40px;line-height:1.1}
h2{font-size:30px;margin:6px 0 14px}
.row{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--b);border-radius:16px;background:var(--c);margin-bottom:10px;flex-wrap:wrap}
.date{background:var(--r);border-radius:12px;padding:6px 10px;text-align:center;min-width:56px;font-family:'Bebas Neue';font-size:24px;line-height:1}
.date small{display:block;font-size:12px;letter-spacing:.1em}
.grow{flex:1;min-width:160px}.grow b{display:block}.grow span{color:var(--m);font-size:13px}
.tag{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--b);text-transform:uppercase;letter-spacing:.06em}
.Confirmado{color:var(--ok);border-color:var(--ok)}.Apartado{color:var(--wa);border-color:var(--wa)}.Realizado{color:var(--m)}.Cancelado{color:var(--r);border-color:var(--r)}
.btn{background:var(--r);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:700 13px Inter;cursor:pointer}
.btn.g{background:#232327;color:var(--t)}
.fab{position:fixed;right:18px;bottom:18px;z-index:9;border-radius:99px;padding:15px 24px;font-size:15px;box-shadow:0 10px 30px #ed1c2466}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{background:#0f0f11;border:1px solid var(--b);color:var(--t);padding:10px 12px;border-radius:12px;font:inherit;width:100%}
.filters input,.filters select{width:auto;flex:1;min-width:140px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--m);font-size:12px}
.day{min-height:74px;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:6px;cursor:pointer;font-size:12px;overflow:hidden}
.day:hover{border-color:var(--r)}.day.today{border-color:var(--r);box-shadow:inset 0 0 0 1px var(--r)}.day.x{opacity:.25}
.dot{display:block;background:#ed1c2433;border-left:3px solid var(--r);border-radius:4px;padding:1px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrack{height:8px;background:#232327;border-radius:9px;overflow:hidden;margin-top:6px}.bartrack i{display:block;height:100%;background:var(--r)}
dialog{background:#111113;color:var(--t);border:1px solid var(--b);border-radius:20px;padding:22px;width:min(92vw,480px);margin:auto}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
dialog img{height:44px;margin-bottom:6px}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:100}
.empty{text-align:center;color:var(--m);padding:40px}
@media(max-width:600px){.brand span{display:none}.day{min-height:56px}.dot{font-size:0;height:6px;padding:0}}
</style>
</head>
<body>
<div id="splash" onclick="this.classList.add('off')"><div><img src="logo.png" alt="Herencia LP"><h1>HERENCIA LP</h1><p>SISTEMA DE RENTAS</p></div></div>
<header><div class="bar">
<div class="brand"><img src="logo.png" alt=""><span class="k" style="font-size:26px;color:var(--t)">HERENCIA LP</span></div>
<nav id="nav"></nav></div></header>
<main id="app"></main>
<button class="btn fab" onclick="openEv()">+ NUEVA RENTA</button>
<dialog id="dlg"></dialog><div id="toast"></div>

<script>
/* 1) Pega aquí la URL de tu Apps Script (termina en /exec). Vacío = modo demo local */
const API='';

const $=s=>document.querySelector(s),
M=n=>(+n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}),
ST=['Apartado','Confirmado','Realizado','Cancelado'],
TP=['Fiesta privada','Boda','XV años','Palenque / Feria','Bar / Antro','Otro'],
TABS=[['res','Resumen'],['cal','Calendario'],['age','Agenda'],['cob','Cobranza'],['pag','Pagos']],
MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),
today=()=>new Date().toISOString().slice(0,10);
let D={ev:[],pg:[]},V='res',cur=new Date(),F={q:'',s:'',m:''};

setTimeout(()=>$('#splash').classList.add('off'),2600);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};

async function load(){
  if(API){try{const r=await(await fetch(API)).json();D={ev:r.eventos,pg:r.pagos}}catch(e){toast('Error al cargar datos')}}
  else D=JSON.parse(localStorage.hlp||'{"ev":[],"pg":[]}');
  draw();
}
function save(t,row,del){
  const a=D[t==='p'?'pg':'ev'],i=a.findIndex(x=>x.id==row.id);
  if(del){if(i>-1)a.splice(i,1)}else if(i>-1)a[i]=row;else a.push(row);
  if(API)fetch(API,{method:'POST',body:JSON.stringify({t,row,del})});
  else localStorage.hlp=JSON.stringify(D);
  draw();
}
const paid=e=>D.pg.filter(p=>p.eventoId==e.id).reduce((s,p)=>s+ +p.monto,0),
saldo=e=>(+e.total||0)-paid(e),
byDate=(a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora),
dd=f=>{const d=new Date(f+'T12:00');return `<div class="date">${d.getDate()}<small>${MES[d.getMonth()]}</small></div>`};

function evRow(e,cob){
  const s=saldo(e);
  return `<div class="row">${dd(e.fecha)}<div class="grow"><b>${e.cliente}</b><span>${e.tipo||''} · ${e.lugar||''} · ${e.hora||''}</span></div>
  <span class="tag ${e.estatus}">${e.estatus}</span>
  <div style="text-align:right"><b>${M(e.total)}</b><br><span style="font-size:12px;color:${s>0?'var(--wa)':'var(--ok)'}">${s>0?'Debe '+M(s):'Liquidado'}</span></div>
  <div style="display:flex;gap:6px">
  ${s>0?`<button class="btn" onclick="openPay('${e.id}')">Abonar</button>`:''}
  ${cob&&e.telefono?`<a class="btn g" target="_blank" href="https://wa.me/52${String(e.telefono).replace(/\D/g,'')}?text=${encodeURIComponent(`Hola ${e.cliente}, te escribimos de Herencia LP. Tu evento del ${e.fecha} tiene un saldo pendiente de ${M(s)}. ¡Gracias!`)}">WhatsApp</a>`:''}
  <button class="btn g" onclick="openEv('${e.id}')">Editar</button></div></div>`}

const views={
res(){
  const m=today().slice(0,7),ev=D.ev.filter(e=>e.estatus!='Cancelado'),
  mes=ev.filter(e=>e.fecha.startsWith(m)),
  cobr=D.pg.filter(p=>String(p.fecha).startsWith(m)).reduce((s,p)=>s+ +p.monto,0),
  pend=ev.reduce((s,e)=>s+Math.max(saldo(e),0),0),
  tot=ev.reduce((s,e)=>s+(+e.total||0),0),
  prox=ev.filter(e=>e.fecha>=today()).sort(byDate);
  return `<h2>Resumen</h2><div class="grid">
  <div class="card"><span class="k">Eventos este mes</span><div class="big">${mes.length}</div></div>
  <div class="card"><span class="k">Cobrado este mes</span><div class="big" style="color:var(--ok)">${M(cobr)}</div></div>
  <div class="card"><span class="k">Por cobrar</span><div class="big" style="color:var(--wa)">${M(pend)}</div></div>
  <div class="card"><span class="k">Cobrado vs. total</span><div class="big">${tot?Math.round((tot-pend)/tot*100):0}%</div><div class="bartrack"><i style="width:${tot?(tot-pend)/tot*100:0}%"></i></div></div></div>
  <h2>Próximos eventos</h2>${prox.slice(0,6).map(e=>evRow(e)).join('')||'<div class="empty">Sin eventos próximos. ¡Agenda el primero!</div>'}`},
cal(){
  const y=cur.getFullYear(),mo=cur.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();
  let h=['D','L','M','M','J','V','S'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div class="day x"></div>';
  for(let d=1;d<=n;d++){
    const f=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
    es=D.ev.filter(e=>e.fecha==f&&e.estatus!='Cancelado');
    h+=`<div class="day ${f==today()?'today':''}" onclick="openEv(null,'${f}')"><b>${d}</b>${es.map(e=>`<span class="dot" onclick="event.stopPropagation();openEv('${e.id}')">${e.hora||''} ${e.cliente}</span>`).join('')}</div>`}
  return `<div style="display:flex;align-items:center;gap:12px"><h2 style="flex:1">${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][mo]} ${y}</h2>
  <button class="btn g" onclick="mv(-1)">‹</button><button class="btn g" onclick="mv(0)">Hoy</button><button class="btn g" onclick="mv(1)">›</button></div><div class="cal">${h}</div>`},
age(){
  const l=D.ev.filter(e=>(!F.s||e.estatus==F.s)&&(!F.m||e.fecha.startsWith(F.m))&&(!F.q||(e.cliente+e.lugar+e.tipo).toLowerCase().includes(F.q.toLowerCase()))).sort(byDate);
  return `<h2>Agenda</h2><div class="filters"><input placeholder="Buscar cliente, lugar..." value="${F.q}" oninput="F.q=this.value;draw(1)">
  <select onchange="F.s=this.value;draw()"><option value="">Todos los estatus</option>${ST.map(s=>`<option ${F.s==s?'selected':''}>${s}</option>`).join('')}</select>
  <input type="month" value="${F.m}" onchange="F.m=this.value;draw()"></div>
  <div id="lst">${l.map(e=>evRow(e)).join('')||'<div class="empty">Sin resultados</div>'}</div>`},
cob(){
  const l=D.ev.filter(e=>e.estatus!='Cancelado'&&saldo(e)>0).sort(byDate),t=l.reduce((s,e)=>s+saldo(e),0);
  return `<h2>Cobranza</h2><div class="card" style="margin-bottom:14px"><span class="k">Total pendiente (${l.length} eventos)</span><div class="big" style="color:var(--wa)">${M(t)}</div></div>
  ${l.map(e=>evRow(e,1)).join('')||'<div class="empty">Todo cobrado 🔥</div>'}`},
pag(){
  const l=[...D.pg].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  return `<h2>Historial de pagos</h2>${l.map(p=>{const e=D.ev.find(x=>x.id==p.eventoId)||{cliente:'(evento borrado)'};
  return `<div class="row"><div class="grow"><b>${e.cliente}</b><span>${p.fecha} · ${p.metodo}</span></div><b style="color:var(--ok)">${M(p.monto)}</b><button class="btn g" onclick="if(confirm('¿Borrar pago?'))save('p',{id:'${p.id}'},1)">✕</button></div>`}).join('')||'<div class="empty">Aún no hay pagos</div>'}`}
};
function mv(n){cur=n?new Date(cur.getFullYear(),cur.getMonth()+n,1):new Date();draw()}
function draw(keep){
  $('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${k==V?'on':''}" onclick="V='${k}';draw()">${t}</button>`).join('');
  if(keep){$('#lst').innerHTML=views.age().match(/<div id="lst">([\s\S]*)<\/div>$/)[1];return}
  $('#app').innerHTML=views[V]();
}

/* Formularios */
const fld=(n,l,v='',t='text',x='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${v??''}" ${x}>`;
function openEv(id,f){
  const e=D.ev.find(x=>x.id==id)||{fecha:f||today(),hora:'20:00',estatus:'Apartado'};
  $('#dlg').innerHTML=`<img src="logo.png"><h2>${id?'Editar':'Nueva'} renta</h2><form id="fm">
  <div class="two">${fld('fecha','Fecha',e.fecha,'date','required')}${fld('hora','Hora',e.hora,'time')}</div>
  ${fld('cliente','Cliente',e.cliente,'text','required')}${fld('telefono','WhatsApp (10 dígitos)',e.telefono,'tel')}
  <div class="two"><div><label>Tipo</label><select name="tipo">${TP.map(t=>`<option ${e.tipo==t?'selected':''}>${t}</option>`).join('')}</select></div>
  <div><label>Estatus</label><select name="estatus">${ST.map(t=>`<option ${e.estatus==t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  ${fld('lugar','Lugar / ciudad',e.lugar)}${fld('total','Precio total (MXN)',e.total,'number','min=0 step=any')}
  <label>Notas</label><textarea name="notas" rows="2">${e.notas||''}</textarea>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Guardar</button>
  ${id?`<button type="button" class="btn g" onclick="delEv('${id}')">Borrar</button>`:''}<button type="button" class="btn g" onclick="$('#dlg').close()">Cerrar</button></div></form>`;
  $('#fm').onsubmit=ev=>{ev.preventDefault();save('e',{...e,id:e.id||uid(),...Object.fromEntries(new FormData(ev.target))});$('#dlg').close();toast('Guardado')};
  $('#dlg').showModal();
}
function delEv(id){if(!confirm('¿Borrar renta y sus pagos?'))return;D.pg.filter(p=>p.eventoId==id).forEach(p=>save('p',p,1));save('e',{id},1);$('#dlg').close()}
function openPay(id){
  const e=D.ev.find(x=>x.id==id);
  $('#dlg').innerHTML=`<img src="logo.png"><h2>Abono · ${e.cliente}</h2><p style="color:var(--m)">Saldo: ${M(saldo(e))}</p><form id="fm">
  ${fld('monto','Monto',saldo(e),'number','required min=1 step=any')}${fld('fecha','Fecha',today(),'date','required')}
  <label>Método</label><select name="metodo"><option>Efectivo</option><option>Transferencia</option><option>Depósito</option><option>Tarjeta</option></select>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">Registrar pago</button><button type="button" class="btn g" onclick="$('#dlg').close()">Cerrar</button></div></form>`;
  $('#fm').onsubmit=ev=>{ev.preventDefault();save('p',{id:uid(),eventoId:id,...Object.fromEntries(new FormData(ev.target))});$('#dlg').close();toast('Pago registrado')};
  $('#dlg').showModal();
}
load();
</script>
</body>
</html>
